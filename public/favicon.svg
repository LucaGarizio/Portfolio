<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background Circle (Subtle) -->
  <circle cx="16" cy="16" r="14" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="0.5" />
  <!-- Monogram LG -->
  <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="16" fill="url(#grad)" letter-spacing="-1">LG</text>
  <!-- Subtle Glow Effect -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.2" />
</svg>
