<div @fadeInOut
  class="fixed inset-0 z-[110] flex items-center justify-center px-4 py-10">
  <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-xl"
    (click)="onClose()"></div>

  <div @slideUpDown
    class="relative w-full max-w-2xl bg-slate-900/80 backdrop-blur-3xl border border-white/10 rounded-3xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]">
    
    <div class="px-8 py-6 border-b border-white/5 flex items-center justify-between sticky top-0 bg-slate-900/40 backdrop-blur-md z-10">
      <h3 class="text-xl font-black text-white uppercase tracking-tight">{{ 'PRIVACY.TITLE' | translate }}</h3>
      <button (click)="onClose()"
        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 transition-colors text-slate-400 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="px-8 py-10 overflow-y-auto custom-scrollbar">
      <div class="prose prose-invert prose-slate max-w-none">
        <p class="text-slate-300 leading-relaxed text-lg" [innerHTML]="'PRIVACY.CONTENT' | translate"></p>
      </div>
    </div>

    <div class="px-8 py-6 border-t border-white/5 flex justify-end sticky bottom-0 bg-slate-900/40 backdrop-blur-md z-10">
      <button (click)="onClose()"
        class="px-8 py-3 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-bold rounded-xl transition-all active:scale-95 uppercase tracking-widest text-xs">
        {{ 'PRIVACY.CLOSE' | translate }}
      </button>
    </div>
  </div>
</div>
