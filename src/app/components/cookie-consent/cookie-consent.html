@if (showBanner()) {
<div
  class="fixed bottom-6 left-6 right-6 md:left-auto md:right-10 md:w-[400px] z-[100] animate-in slide-in-from-bottom-10 duration-500">
  <div class="bg-slate-900/40 backdrop-blur-2xl border border-white/10 rounded-2xl p-6 shadow-2xl relative overflow-hidden group">
    <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-sky-400 to-purple-500"></div>
    
    <div class="relative z-10">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-sky-400">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <h3 class="text-lg font-bold text-white uppercase tracking-wider">{{ 'COOKIE.TITLE' | translate }}</h3>
      </div>

      <p class="text-slate-400 text-sm leading-relaxed mb-6">
        {{ 'COOKIE.MESSAGE' | translate }}
      </p>

      <div class="flex flex-col sm:flex-row gap-3">
        <button (click)="accept()"
          class="flex-1 px-6 py-2.5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-black uppercase tracking-widest rounded-xl transition-all active:scale-95 shadow-lg shadow-sky-600/20">
          {{ 'COOKIE.ACCEPT' | translate }}
        </button>
        <button (click)="decline()"
          class="flex-1 px-6 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 text-white text-xs font-black uppercase tracking-widest rounded-xl transition-all active:scale-95">
          {{ 'COOKIE.DECLINE' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
}
