<footer class="py-12 px-4 border-t border-white/5">
  <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
    <div class="flex flex-col md:flex-row items-center gap-4 md:gap-8 text-slate-500 text-sm">
      <span>© {{ year }} Luca Garizio. {{ 'FOOTER.RIGHTS' | translate }}</span>
      <button (click)="openPrivacy.emit()"
        class="hover:text-white transition-colors text-[10px] uppercase font-bold tracking-[0.2em] opacity-50 hover:opacity-100">
        {{ 'FOOTER.PRIVACY' | translate }}
      </button>
    </div>
    <div class="flex gap-8">
      <button (click)="transitionService.startTransition('https://www.linkedin.com/in/luca-garizio-1839122b8')"
        class="text-slate-400 hover:text-white transition-colors font-medium">LinkedIn</button>
      <button (click)="transitionService.startTransition('https://github.com/LucaGarizio')"
        class="text-slate-400 hover:text-white transition-colors font-medium">GitHub</button>
    </div>
  </div>
</footer>
