<nav [class.-translate-y-full]="!isVisible()"
  class="fixed top-0 w-full z-50 bg-slate-900/80 backdrop-blur-xl border-b border-white/10 transition-transform duration-500">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 md:h-20">
      <div class="flex-shrink-0">
        <a href="#"
          (click)="setActiveSection('hero')"
          class="flex items-center group">
          <img src="assets/images/logo/logo.png"
            alt="LG Logo"
            class="h-12 md:h-16 w-auto transition-all duration-300 group-hover:scale-[1.03] drop-shadow-[0_0_8px_rgba(2,132,199,0.3)] will-change-transform logo-filter">
        </a>
      </div>
      <div class="hidden md:block">
        <div class="ml-10 flex items-baseline space-x-8">
          <a href="#about"
            (click)="setActiveSection('about')"
            class="text-slate-300 hover:text-white px-3 py-2 text-sm font-medium transition-all border-b-2 border-transparent hover:border-sky-400 uppercase md:hover:scale-110 inline-block"
            [class.scale-110]="activeSection() === 'about'"
            [class.text-white]="activeSection() === 'about'"
            [class.border-sky-400]="activeSection() === 'about'">{{
            'NAVBAR.ABOUT' | translate }}</a>
          <a href="#projects"
            (click)="setActiveSection('projects')"
            class="text-slate-300 hover:text-white px-3 py-2 text-sm font-medium transition-all border-b-2 border-transparent hover:border-sky-400 uppercase md:hover:scale-110 inline-block"
            [class.scale-110]="activeSection() === 'projects'"
            [class.text-white]="activeSection() === 'projects'"
            [class.border-sky-400]="activeSection() === 'projects'">{{
            'NAVBAR.PROJECTS' | translate }}</a>
          <a href="#contact"
            (click)="setActiveSection('contact')"
            class="text-slate-300 hover:text-white px-3 py-2 text-sm font-medium transition-all border-b-2 border-transparent hover:border-sky-400 uppercase md:hover:scale-110 inline-block"
            [class.scale-110]="activeSection() === 'contact'"
            [class.text-white]="activeSection() === 'contact'"
            [class.border-sky-400]="activeSection() === 'contact'">{{
            'NAVBAR.CONTACT' | translate }}</a>

          <div class="flex items-center border-l border-white/10 pl-6 ml-4">
            <div
              class="bg-white/5 p-0.5 rounded-full flex items-center gap-0.5 border border-white/10 backdrop-blur-md">
              <button (click)="changeLanguage('it')"
                class="px-4 py-1 rounded-full text-xs font-black transition-all duration-300"
                [class.bg-sky-600]="currentLang() === 'it'"
                [class.text-white]="currentLang() === 'it'"
                [class.text-slate-500]="currentLang() !== 'it'">
                IT
              </button>
              <button (click)="changeLanguage('en')"
                class="px-4 py-1 rounded-full text-xs font-black transition-all duration-300"
                [class.bg-sky-600]="currentLang() === 'en'"
                [class.text-white]="currentLang() === 'en'"
                [class.text-slate-500]="currentLang() !== 'en'">
                EN
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="md:hidden flex items-center gap-4">
        <div class="bg-white/5 p-0.5 rounded-full flex items-center gap-0.5 border border-white/10 backdrop-blur-md">
          <button (click)="changeLanguage('it')"
            class="px-3 py-1 rounded-full text-[10px] font-black transition-all duration-300"
            [class.bg-sky-600]="currentLang() === 'it'"
            [class.text-white]="currentLang() === 'it'"
            [class.text-slate-500]="currentLang() !== 'it'">
            IT
          </button>
          <button (click)="changeLanguage('en')"
            class="px-3 py-1 rounded-full text-[10px] font-black transition-all duration-300"
            [class.bg-sky-600]="currentLang() === 'en'"
            [class.text-white]="currentLang() === 'en'"
            [class.text-slate-500]="currentLang() !== 'en'">
            EN
          </button>
        </div>

        <button type="button"
          (click)="toggleMenu()"
          class="text-slate-400 hover:text-white focus:outline-none transition-colors relative z-[60]">
          <span class="sr-only">Main menu</span>
          <svg class="h-6 w-6">
            @if (isMenuOpen()) {
            <use xlink:href="assets/images/icons.svg#icon-close"></use>
            } @else {
            <use xlink:href="assets/images/icons.svg#icon-menu"></use>
            }
          </svg>
        </button>
      </div>
    </div>
  </div>

  @if (isMenuOpen()) {
  <div @slideInOut
    class="absolute top-16 left-0 w-full bg-slate-900/95 backdrop-blur-3xl border-b border-white/10 z-[40] md:hidden shadow-2xl">
    <div class="px-4 pt-4 pb-8 space-y-2 relative">

      <a href="#about"
        (click)="closeMenu()"
        class="text-white hover:text-sky-400 block px-4 py-4 text-xl font-semibold transition-all rounded-lg hover:bg-white/5 active:scale-95 uppercase">
        {{ 'NAVBAR.ABOUT' | translate }}
      </a>
      <a href="#projects"
        (click)="closeMenu()"
        class="text-white hover:text-sky-400 block px-4 py-4 text-xl font-semibold transition-all rounded-lg hover:bg-white/5 active:scale-95 uppercase">
        {{ 'NAVBAR.PROJECTS' | translate }}
      </a>
      <a href="#contact"
        (click)="closeMenu()"
        class="text-white hover:text-sky-400 block px-4 py-4 text-xl font-semibold transition-all rounded-lg hover:bg-white/5 active:scale-95 uppercase">
        {{ 'NAVBAR.CONTACT' | translate }}
      </a>


    </div>
  </div>

  <div @fadeInOut
    (click)="closeMenu()"
    class="fixed inset-0 bg-slate-950/80 backdrop-blur-3xl z-[30] md:hidden">
  </div>
  }
</nav>
