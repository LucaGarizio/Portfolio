<div class="min-h-screen bg-slate-900 text-gray-100 selection:bg-sky-500/30 font-sans">
  @if (transitionService.isEntering()) {
  <div class="iris-hole-in"></div>
  }


  @if (transitionService.isTransitioning()) {
  <div class="iris-hole"></div>
  }

  <div class="fixed top-0 left-0 w-full vh-stable z-0 overflow-hidden pointer-events-none">

    <div class="absolute inset-0 opacity-40 mix-blend-overlay">
      <img src="assets/images/bg/hero-bg.png"
        alt=""
        class="w-full h-full object-cover">
    </div>

    <div class="absolute inset-0 opacity-[0.15] bg-dot-pattern">
    </div>


    <div
      class="absolute top-[15%] left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-sky-500/10 rounded-full blur-[120px]">
    </div>
    <div class="absolute top-[40%] left-1/4 w-[600px] h-[600px] bg-purple-500/10 rounded-full blur-[120px]"></div>
    <div class="absolute top-[70%] right-1/4 w-[500px] h-[500px] bg-sky-500/5 rounded-full blur-[100px]"></div>

    <div
      class="absolute top-[20%] right-[15%] w-32 h-32 bg-white/5 backdrop-blur-md rounded-2xl rotate-12 border border-white/10 animate-float-slow hidden lg:block">
    </div>
    <div
      class="absolute top-[60%] left-[10%] w-24 h-24 bg-sky-500/5 backdrop-blur-md rounded-full border border-white/10 animate-float hidden lg:block">
    </div>


    <div
      class="absolute bottom-0 left-0 w-full h-[40%] bg-gradient-to-t from-slate-900 via-slate-900/80 to-transparent">
    </div>
    <div class="absolute top-0 right-0 h-full w-[30%] bg-gradient-to-l from-slate-900 via-slate-900/80 to-transparent">
    </div>


    <div class="absolute inset-x-0 bottom-0 h-[150vh] opacity-30 mix-blend-lighten">
      <img src="assets/images/bg/projects-contact-bg.png"
        alt=""
        class="w-full h-full object-cover">
      <div class="absolute top-0 left-0 w-full h-[30%] bg-gradient-to-b from-slate-900 via-slate-900/40 to-transparent">
      </div>
      <div
        class="absolute bottom-0 left-0 w-full h-[30%] bg-gradient-to-t from-slate-900 via-slate-900/40 to-transparent">
      </div>
      <div class="absolute top-0 left-0 h-full w-[15%] bg-gradient-to-r from-slate-900 to-transparent"></div>
      <div class="absolute top-0 right-0 h-full w-[15%] bg-gradient-to-l from-slate-900 to-transparent"></div>
    </div>
  </div>

  <div class="fixed top-0 left-0 h-1 bg-sky-600 z-[100] transition-all duration-150 ease-out hidden md:block scroll-bar"
    [style.--scroll-progress]="scrollProgress() + '%'">
  </div>

  <app-navbar></app-navbar>

  <main class="relative z-10">
    <app-hero></app-hero>
    <app-about></app-about>
    <app-projects></app-projects>
    <app-contact></app-contact>
  </main>

  <div class="relative z-10 border-t border-white/5">
  <app-footer (openPrivacy)="showPrivacyModal.set(true)"></app-footer>
  </div>
</div>

<app-cookie-consent></app-cookie-consent>

@if (showPrivacyModal()) {
<app-privacy-modal (close)="showPrivacyModal.set(false)"></app-privacy-modal>
}

<router-outlet />
